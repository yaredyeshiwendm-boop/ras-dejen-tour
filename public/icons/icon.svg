<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b17"/>
      <stop offset="1" stop-color="#123c32"/>
    </linearGradient>

    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f1df"/>
      <stop offset="1" stop-color="#9eb8a7"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#e7b84b"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="12"
        flood-opacity=".35"
      />
    </filter>
  </defs>

  <!-- App background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"
  />

  <!-- Sun -->
  <circle
    cx="365"
    cy="135"
    r="58"
    fill="url(#sun)"
    opacity=".98"
  />

  <!-- Sun glow -->
  <circle
    cx="365"
    cy="135"
    r="82"
    fill="#f6d86a"
    opacity=".08"
  />

  <!-- Back mountain -->
  <path
    d="M35 405
       L145 270
       L205 325
       L275 220
       L350 310
       L415 250
       L477 405 Z"
    fill="#315b4d"
    opacity=".8"
  />

  <!-- Main Ras Dejen mountain -->
  <path
    d="M45 420
       L145 300
       L205 365
       L285 145
       L370 310
       L420 265
       L480 420 Z"
    fill="url(#mountain)"
    filter="url(#shadow)"
  />

  <!-- Snow / summit -->
  <path
    d="M285 145
       L255 225
       L280 210
       L296 236
       L315 208
       L338 245
       L370 310
       Z"
    fill="#ffffff"
    opacity=".92"
  />

  <!-- Mountain shadow -->
  <path
    d="M205 365
       L285 145
       L370 310
       L322 285
       L300 350
       L270 320
       L245 385 Z"
    fill="#527265"
    opacity=".65"
  />

  <!-- Foreground -->
  <path
    d="M0 420
       Q100 395 190 425
       T380 415
       T512 425
       V512
       H0 Z"
    fill="#061410"
  />

  <!-- Small trail -->
  <path
    d="M275 420
       C290 395 305 380 315 350
       C321 332 330 318 343 305"
    fill="none"
    stroke="#d8b65b"
    stroke-width="7"
    stroke-linecap="round"
    opacity=".9"
  />

  <!-- Brand mark -->
  <circle
    cx="82"
    cy="86"
    r="36"
    fill="#ffffff"
    opacity=".08"
  />

  <text
    x="82"
    y="96"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="800"
    fill="#ffffff"
  >RD</text>
</svg>
